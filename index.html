<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ngobrol Komunitas</title>

    <!-- Memanggil File Manifest Resmi -->
    <link rel="manifest" href="manifest.json">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0b141a; }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <!-- src diisi lewat script agar tidak load dua kali -->
    <iframe id="chatFrame"></iframe>
    <script>
        // Teruskan query string (contoh: ?tkn=xxxx) dari wrapper ke GAS Chat
        const baseUrl = "https://script.google.com/macros/s/AKfycbziaKDfkXYcj_jemUs6iBAKLAdy7NaOjsk91F5kkzYWlE2fNvYoEe6d3n4Pnbnc5pM/exec";
        const params  = window.location.search; // "" atau "?tkn=xxxxx"
        document.getElementById("chatFrame").src = baseUrl + params;

        // Mendaftarkan File Service Worker Resmi
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker Terdaftar!"))
            .catch(err => console.log("Gagal:", err));
        }
    </script>
</body>
</html>
